name: Build blueprint

# Migrated from .travis.yml: builds the epub, PDF and printable booklet with
# pandoc + LaTeX. Builds run on every push and pull request; pushing a tag
# additionally publishes the artifacts to a GitHub Release.

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            poppler-utils \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-extra-utils \
            texlive-plain-generic

      - name: Build epub, PDF and booklet
        run: |
          set -euo pipefail
          DATE="$(date --iso-8601=date)"

          # epub (e-reader version)
          pandoc --verbose pandoc-metadata.yaml README.md [0-9]*.md \
            -o hackerspace-blueprint.epub \
            --metadata date="$DATE" \
            --toc-depth=2 \
            --epub-embed-font='epub-fonts/*.ttf' \
            --css=epub.css

          # PDF
          pandoc --verbose pandoc-metadata.yaml README.md [0-9]*.md \
            -o hackerspace-blueprint.pdf \
            --metadata date="$DATE" \
            --template eisvogel.tex \
            --include-before-body=include-cover.tex \
            --include-after-body=include-back.tex

          # Printable booklet body (imposed 2-up); the cover is committed as
          # hackerspace-blueprint-booklet-cover.pdf. The classic `pdfbook` is
          # just pdfjam with these options, and pdfjam ships in apt's TeX Live.
          numpages="$(pdfinfo hackerspace-blueprint.pdf | awk '/^Pages/ { print $2 }')"
          pdfjam hackerspace-blueprint.pdf "2-$((numpages - 2))" \
            --booklet true --landscape \
            -o hackerspace-blueprint-booklet-body.pdf

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hackerspace-blueprint
          path: |
            hackerspace-blueprint.epub
            hackerspace-blueprint.pdf
            hackerspace-blueprint-booklet-body.pdf

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hackerspace-blueprint.epub
            hackerspace-blueprint.pdf
            hackerspace-blueprint-booklet-cover.pdf
            hackerspace-blueprint-booklet-body.pdf
